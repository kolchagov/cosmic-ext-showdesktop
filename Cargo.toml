[package]
name = "cosmic-ext-showdesktop"
version = "0.1.0"
edition = "2021"
description = "COSMIC panel applet: show desktop by minimizing/restoring tracked windows"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "tokio", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "5.0"
